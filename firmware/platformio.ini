; ==============================================================
;  newton-instrumentation — ESP32 firmware
; ==============================================================
;  PlatformIO, not the Arduino IDE: the library versions live in
;  this file and this file goes to git, so the build is
;  reproducible on any machine.
;
;  If macOS does not show the serial port, install the WCH CH340
;  driver. The board ordered is a DevKit V1 with CP2102, which
;  macOS handles natively — the CH340 note is for clones.
; ==============================================================

[env:esp32doit-devkit-v1]
platform  = espressif32
board     = esp32doit-devkit-v1
framework  = arduino

monitor_speed = 115200
upload_speed  = 921600

build_flags =
	-D CORE_DEBUG_LEVEL=3

; --------------------------------------------------------------
;  Libraries — pinned, never floating
; --------------------------------------------------------------
;  Versions are placeholders until the hardware arrives and the
;  build is verified. Pin whatever actually compiles, then leave
;  it pinned.
; --------------------------------------------------------------
lib_deps =
	paulstoffregen/OneWire
	milesburton/DallasTemperature      ; 4x DS18B20
	adafruit/Adafruit AHTX0            ; AHT20  — humidity + temp
	adafruit/Adafruit BMP280 Library   ; BMP280 — pressure
	adafruit/Adafruit BusIO
	bblanchon/ArduinoJson              ; the API serves JSON, not HTML
